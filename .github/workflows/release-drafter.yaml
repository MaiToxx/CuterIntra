name: Release Drafter

# On pushes to main only: the job holds a write token, and a pull request has
# nothing to add to the draft before it is merged.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Get Commits with Details
        id: commits
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --format="%s|%h" | head -50)
          else
            COMMITS=$(git log $PREV_TAG..HEAD --format="%s|%h")
          fi
          # A delimiter no commit subject can contain: a subject "EOF" would
          # otherwise end the value and write outputs of its own.
          DELIM="commits_$(openssl rand -hex 16)"
          {
            echo "commits<<$DELIM"
            echo "$COMMITS"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Categorize Changes
        id: categorize
        # Commit subjects are untrusted text: they reach the script as an
        # environment variable, never pasted into its source, where a quote,
        # a backtick or $( ) in a subject would run as shell.
        env:
          COMMITS: ${{ steps.commits.outputs.commits }}
          REPO: ${{ github.repository }}
        run: |
          BREAKING=""
          FEATURES=""
          BUGFIXES=""
          CHORES=""
          OTHER=""
          
          while IFS='|' read -r message hash; do
            [ -z "$message" ] && continue
            LINK="https://github.com/$REPO/commit/$hash"
            ENTRY="- $message ([$hash]($LINK))"
            
            if echo "$message" | grep -qi "breaking\|BREAKING CHANGE"; then
              BREAKING+=$'\n'"$ENTRY"
            elif echo "$message" | grep -qi "^feat(\|^feat:"; then
              FEATURES+=$'\n'"$ENTRY"
            elif echo "$message" | grep -qi "^fix(\|^fix:"; then
              BUGFIXES+=$'\n'"$ENTRY"
            elif echo "$message" | grep -qi "^chore(\|^chore:"; then
              CHORES+=$'\n'"$ENTRY"
            else
              OTHER+=$'\n'"$ENTRY"
            fi

          done <<< "$COMMITS"
          
          DELIM="changelog_$(openssl rand -hex 16)"
          {
            echo "changelog<<$DELIM"
            echo "## What's Changed"
            echo ""
            [ -n "$BREAKING" ] && echo "### Breaking Changes 🛠" && echo -e "$BREAKING" && echo ""
            [ -n "$FEATURES" ] && echo "### Features 🎉" && echo -e "$FEATURES" && echo ""
            [ -n "$BUGFIXES" ] && echo "### Bug fixes 🐛" && echo -e "$BUGFIXES" && echo ""
            [ -n "$CHORES" ] && echo "### Maintenance 🧹" && echo -e "$CHORES" && echo ""
            [ -n "$OTHER" ] && echo "### Other Changes 🔄" && echo -e "$OTHER" && echo ""
            
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog:** https://github.com/$REPO/compare/$PREV_TAG...HEAD"
            fi
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Update Draft Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CHANGELOG_DATA: ${{ steps.categorize.outputs.changelog }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const changelog = process.env.CHANGELOG_DATA;
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const draftRelease = releases.data.find(r => r.draft === true && r.name.includes('Draft Release'));

            if (draftRelease) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draftRelease.id,
                body: changelog,
              });
            } else {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: 'v-draft',
                name: '📋Draft Release',
                body: changelog,
                draft: true,
              });
            }
