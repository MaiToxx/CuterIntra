name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc

      - name: Tests
        run: npm test

      - name: Generated theme files are up to date
        run: npm run check:themes

      - name: Build (Chrome)
        run: npm run build:chrome

      - name: Build (Firefox)
        run: npm run build:firefox

      # The Chrome build in a real Chrome (docs/FIREFOX-TESTING.md, "Chrome").
      # ubuntu-latest ships google-chrome; if an image ever drops it the
      # harness exits 3 ("no Chrome found") and this step only warns: the
      # heads-up before publish.yaml, whose gate has no such exception,
      # refuses to release. Everything else fails the job: a failed check (1),
      # and a usage error or a crash of the harness (2), which used to share
      # "no Chrome"'s code and passed as skipped.
      - name: Smoke test (Chrome)
        run: |
          node scripts/firefox-smoke.mjs dist-chrome --browser chrome --runs 3 --cold 1 --no-sandbox
          code=$?
          if [ "$code" -eq 3 ]; then echo "::warning::Chrome smoke test skipped: no usable Chrome on this runner. publish.yaml will refuse to release until it has one."; exit 0; fi
          exit "$code"
        shell: bash {0}

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: better-intra-builds
          path: |
            dist-chrome
            dist-firefox
          retention-days: 14

      # Last on purpose: the budgets are checked once both builds exist, and
      # after the upload, so a failing budget still leaves you the artifacts to
      # inspect. Budgets live in scripts/measure-bundle.js (see docs/PERFORMANCE.md).
      - name: Bundle size budgets
        run: npm run check:size
      - name: No runtime import cycles
        run: npm run check:cycles
